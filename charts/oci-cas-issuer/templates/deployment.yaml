{{- $leaderElection := dict "enabled" true "leaseDuration" "60s" "renewDeadline" "40s" "retryPeriod" "15s" -}}
{{- if kindIs "bool" .Values.leaderElection -}}
{{- $_ := set $leaderElection "enabled" .Values.leaderElection -}}
{{- else -}}
{{- $leaderElection = mergeOverwrite $leaderElection (default dict .Values.leaderElection) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oci-cas-issuer.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "oci-cas-issuer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oci-cas-issuer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oci-cas-issuer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oci-cas-issuer.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "%s-controller" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if $leaderElection.enabled }}
            - --leader-elect
            - --leader-elect-lease-duration={{ $leaderElection.leaseDuration }}
            - --leader-elect-renew-deadline={{ $leaderElection.renewDeadline }}
            - --leader-elect-retry-period={{ $leaderElection.retryPeriod }}
            {{- end }}
            - --cluster-resource-namespace={{ default .Release.Namespace .Values.clusterResourceNamespace }}
            - --oci-certificate-delete-after={{ default "48h" .Values.ociCertificateDeleteAfter }}
            {{- $gc := default dict .Values.garbageCollector }}
            - --garbage-collector-interval={{ ternary (default "1h" $gc.interval) "0" (default true $gc.enabled) }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
