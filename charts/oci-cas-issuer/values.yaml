replicaCount: 1

image:
  repository: ghcr.io/hjames9/oci-cas-issuer
  # Defaults to <Chart.appVersion>-controller when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  # Add OKE Workload Identity annotations here when required by your cluster setup.
  annotations: {}

# Keep enabled for RollingUpdate deployments, where old and new pods overlap.
# Legacy boolean values are also supported: true uses the default timings below,
# and false disables leader election and omits all leader-election flags.
# Timings must be positive, with leaseDuration > renewDeadline > retryPeriod.
leaderElection:
  enabled: true
  leaseDuration: 60s
  renewDeadline: 40s
  retryPeriod: 15s

# Empty uses Kubernetes' default RollingUpdate strategy. If leader election is
# disabled, use {type: Recreate} to prevent pods from overlapping during rollouts.
strategy: {}
# Namespace used to resolve Secret references for OCIClusterIssuer resources.
# Defaults to the Helm release namespace when empty.
clusterResourceNamespace: ""

ociCertificateDeleteAfter: 48h
garbageCollector:
  enabled: true
  interval: 1h

metrics:
  service:
    enabled: true
    port: 8080
    annotations: {}

certManager:
  approver:
    enabled: true
    serviceAccount:
      name: cert-manager
      namespace: cert-manager

resources: {}

podAnnotations: {}
podLabels: {}
extraEnv: []
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
